name: Set Kernel Config
description: Patch the Muzel defconfig directly (add or modify entries)

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch Muzel defconfig
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    env:
      CONFIG_LIST: ${{ inputs.config_list }}
    run: |
      set -euo pipefail

      DEFCONFIG="private/devices/google/muzel/muzel_defconfig"

      if [ ! -f "$DEFCONFIG" ]; then
        echo "ERROR: $DEFCONFIG not found" >&2
        exit 1
      fi

      apply_line() {
        local line="$1"
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        # skip empty/comments
        [[ -z "$line" || "$line" == \#* ]] && return 0

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        echo "Processing: $key=$value"

        # if config exists anywhere in file → replace it
        if grep -q "^$key=" "$DEFCONFIG"; then
          sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
        elif grep -q "^# $key is not set" "$DEFCONFIG"; then
          sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
        else
          # not present → append
          echo "$key=$value" >> "$DEFCONFIG"
        fi
      }

      while IFS= read -r line || [ -n "$line" ]; do
        apply_line "$line"
      done <<< "$CONFIG_LIST"

name: Set Kernel Config
description: Configure both the source kernel Image and Muzel device modules

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch base and Muzel defconfigs
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    env:
      CONFIG_LIST: ${{ inputs.config_list }}
    run: |
      set -euo pipefail

      # Muzel's device target builds modules on top of kernel_aarch64. Its
      # fragment alone does not configure the base Image shipped in dist.
      DEFCONFIGS=(
        "common/ack/arch/arm64/configs/gki_defconfig"
        "private/devices/google/muzel/muzel_defconfig"
      )
      for DEFCONFIG in "${DEFCONFIGS[@]}"; do
        if [ ! -f "$DEFCONFIG" ]; then
          echo "ERROR: $DEFCONFIG not found" >&2
          exit 1
        fi
      done

      apply_line() {
        local line="$1"
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        # skip empty/comments
        [[ -z "$line" || "$line" == \#* ]] && return 0

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        echo "Processing: $key=$value"

        # if config exists anywhere in file → replace it
        if grep -q "^$key=" "$DEFCONFIG"; then
          sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
        elif grep -q "^# $key is not set" "$DEFCONFIG"; then
          sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
        else
          # not present → append
          echo "$key=$value" >> "$DEFCONFIG"
        fi
      }

      for DEFCONFIG in "${DEFCONFIGS[@]}"; do
        while IFS= read -r line || [ -n "$line" ]; do
          apply_line "$line"
        done <<< "$CONFIG_LIST"
      done

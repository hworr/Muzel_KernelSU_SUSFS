name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

runs:
  using: composite
  steps:
  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "build/build.sh" ]; then
        sed -i 's/check_defconfig//' ./aosp/build.config.gki
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=thin \
        BUILD_CONFIG=aosp/build.config.gki.aarch64 \
        CC="/usr/bin/ccache clang" \
        CXX="/usr/bin/ccache clang++" \
        HOSTCC="/usr/bin/ccache clang" \
        HOSTCXX="/usr/bin/ccache clang++" \
        build/build.sh -j"$(nproc)"
      else
        tools/bazel run \
          --verbose_failures \
          --config=stamp \
          --config=muzel \
          //private/devices/google/muzel:lga_muzel_dist "$@"
      fi

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "build/build.sh" ]; then
        IMAGE="/home/runner/out/dist/Image"
      else
        IMAGE="out/muzel/dist/Image"
      fi

      if [ ! -s "$IMAGE" ]; then
        echo "::error::Kernel build did not produce $IMAGE"
        exit 1
      fi
      echo "Found Image at $IMAGE"
      cp "$IMAGE" "${{ github.workspace }}/AnyKernel3/Image"
